<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" id="theme-color-meta" />
    <title>Acceso Restringido</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* iOS-like scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass-panel {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .animate-breathe {
        animation: breathe 4s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .animate-float {
        animation: float 2.5s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes float-diagonal {
        0%, 100% { transform: translate3d(0.8px, 0.8px, 0); }
        50% { transform: translate3d(-0.8px, -0.8px, 0); }
      }
      .animate-float-diagonal {
        animation: float-diagonal 2s ease-in-out infinite;
        will-change: transform;
      }
      
      /* --- iOS Alert Animations --- */
      @keyframes ios-alert-enter {
        0% { transform: scale(1.15); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-ios-alert-enter {
        animation: ios-alert-enter 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes ios-alert-exit {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .animate-ios-alert-exit {
        animation: ios-alert-exit 0.2s ease-in forwards;
        will-change: opacity;
      }

      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body class="bg-[#0a0a0a]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
